<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
  .split { position: absolute; top: 150px; left: 64px; right: 64px; height: 560px; display: flex; gap: 0; }
  .half { flex: 1; position: relative; overflow: hidden; border-radius: 3px; }
  .half img { width: 100%; height: 100%; object-fit: cover; }
  .half.before img { filter: grayscale(85%) brightness(0.9); }
  .half .tag {
    position: absolute; top: 22px; left: 22px;
    font-family: var(--font-mono); font-size: 17px; letter-spacing: 3px; text-transform: uppercase;
    background: rgba(10,10,10,0.72); color: var(--paper);
    padding: 10px 16px; border-radius: 3px;
  }
  .half.after .tag { background: var(--copper-grad); color: #fff; }
  .arrow {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 84px; height: 84px; border-radius: 3px;
    background: var(--copper-grad);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-heading); font-size: 40px; font-weight: 600; color: #fff;
    box-shadow: 0 18px 50px rgba(0,0,0,0.55);
    z-index: 5;
  }
  .content { position: absolute; left: 64px; right: 64px; top: 756px; z-index: 10; }
  h1 { font-size: 94px; }
  .sub { margin-top: 26px; max-width: 860px; }
  .chips { margin-top: 34px; }
</style></head>
<body>
<div class="post">
  <div class="toplabel"><span>Direct Builders</span><span class="dot"></span><span>Gen. Contractor</span></div>

  <div class="split">
    <div class="half before"><img src="../assets/buildout-shell.jpg"><span class="tag">Shell</span></div>
    <div class="half after"><img src="../assets/goldberg-interior.jpg"><span class="tag">Suite</span></div>
    <div class="arrow">→</div>
  </div>

  <div class="content">
    <div class="kicker">04 / Tenant Improvements</div>
    <h1>From shell<br>to <span class="accent">suite.</span></h1>
    <p class="sub">Interior buildouts for commercial landlords and tenants — design through final punch list, permits handled in-house.</p>
    <div class="chips">
      <span class="chip">Office</span>
      <span class="chip">Retail</span>
      <span class="chip">Medical</span>
    </div>
  </div>

  <div class="footer">
    <div class="logochip"><img src="../assets/logo.png"></div>
    <div class="contact"><b>305.232.2329</b> · directbuilders.net<br>FL Licensed GC · CGC1523480</div>
  </div>
</div>
</body></html>
