<title>The Snack Shack Bakery · Deltona, FL</title>
<style>
/* ============ FONTS ============ */
@font-face{font-family:'Baloo 2';font-style:normal;font-weight:600;font-display:swap;src:url({{FONT:Baloo2-600}}) format('woff2')}
@font-face{font-family:'Baloo 2';font-style:normal;font-weight:700;font-display:swap;src:url({{FONT:Baloo2-700}}) format('woff2')}
@font-face{font-family:'Baloo 2';font-style:normal;font-weight:800;font-display:swap;src:url({{FONT:Baloo2-800}}) format('woff2')}
@font-face{font-family:'Nunito';font-style:normal;font-weight:400;font-display:swap;src:url({{FONT:Nunito-400}}) format('woff2')}
@font-face{font-family:'Nunito';font-style:normal;font-weight:600;font-display:swap;src:url({{FONT:Nunito-600}}) format('woff2')}
@font-face{font-family:'Nunito';font-style:normal;font-weight:700;font-display:swap;src:url({{FONT:Nunito-700}}) format('woff2')}
@font-face{font-family:'Nunito';font-style:normal;font-weight:800;font-display:swap;src:url({{FONT:Nunito-800}}) format('woff2')}

/* ============ TOKENS ============
   Radius system: cards 18px, chips/inputs 12px, buttons pill.
   Sticker style: 2.5px ink outline + hard offset shadow. */
:root{
  --ink:#332a20;
  --ink-soft:#5d5347;
  --sky:#cde9f8;
  --sky-2:#b7ddf3;
  --cloud:#ffffff;
  --grass:#8cc63e;
  --grass-2:#67a934;
  --grass-3:#4c8f27;
  --cream:#fff8ea;
  --cream-2:#fdf2da;
  --card:#fffefb;
  --accent:#3d8b2f;
  --accent-dark:#2c6b21;
  --accent-soft:#e3f2d9;
  --yellow:#ffd94d;
  --red:#cf4a35;
  --red-soft:#fbe3de;
  --brown:#7a5433;
  --line:2.5px solid var(--ink);
  --pop:0 4px 0 var(--ink);
  --pop-sm:0 3px 0 var(--ink);
  --r-card:18px;
  --r-chip:12px;
  --font-display:'Baloo 2',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:96px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  font-family:var(--font-body);color:var(--ink);background:var(--cream);
  line-height:1.6;font-size:16.5px;overflow-x:hidden;
}
img{max-width:100%;display:block}
a{color:var(--accent-dark)}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.12;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.icon{width:1.15em;height:1.15em;flex:none;vertical-align:-0.2em;fill:currentColor}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;gap:.5em;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:1.02rem;
  padding:.72em 1.5em;border-radius:999px;border:var(--line);
  box-shadow:var(--pop);text-decoration:none;color:var(--ink);background:var(--card);
  transition:transform .15s ease,box-shadow .15s ease;white-space:nowrap;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-dark)}
.btn-yellow{background:var(--yellow)}
.btn-sm{font-size:.9rem;padding:.5em 1.1em;box-shadow:var(--pop-sm)}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none;box-shadow:var(--pop)}

/* ============ STICKER CARD ============ */
.sticker{background:var(--card);border:var(--line);border-radius:var(--r-card);box-shadow:var(--pop)}

/* ============ NAV ============ */
.nav{
  position:sticky;top:0;z-index:50;background:var(--sky);
  border-bottom:var(--line);
}
.nav-inner{display:flex;align-items:center;gap:20px;height:70px;max-width:1180px;margin:0 auto;padding:0 20px}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--font-display);font-weight:800;font-size:1.25rem;line-height:1.05}
.nav-logo svg{width:44px;height:44px}
.nav-logo small{display:block;font-family:var(--font-body);font-weight:700;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.nav-links{display:flex;gap:4px;margin-left:auto;align-items:center}
.nav-links a{
  text-decoration:none;color:var(--ink);font-weight:700;font-size:.95rem;
  padding:.45em .85em;border-radius:999px;border:2.5px solid transparent;
}
.nav-links a:hover{background:var(--cloud);border-color:var(--ink)}
.nav-cart{margin-left:6px}
.nav-burger{display:none;margin-left:auto;background:var(--card);border:var(--line);border-radius:12px;box-shadow:var(--pop-sm);padding:.4em .6em}
@media(max-width:920px){
  .nav-links{display:none;position:absolute;top:70px;left:0;right:0;background:var(--sky);flex-direction:column;align-items:stretch;padding:12px 20px 18px;border-bottom:var(--line);gap:6px}
  .nav-links.open{display:flex}
  .nav-links a{background:var(--cloud);border-color:var(--ink);text-align:center}
  .nav-burger{display:inline-flex}
  .nav-cart{margin-left:auto}
}

/* ============ ANNOUNCEMENT MARQUEE ============ */
.ticker{background:var(--ink);color:var(--cream);overflow:hidden;border-bottom:var(--line)}
.ticker-track{display:flex;gap:0;width:max-content;animation:tick 36s linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker span{display:inline-flex;align-items:center;gap:.55em;padding:.5em 1.6em;font-weight:700;font-size:.88rem;white-space:nowrap}
.ticker .icon{color:var(--yellow)}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker-track{animation:none}}

/* ============ HERO ============ */
.hero{background:linear-gradient(var(--sky) 78%, var(--sky-2));position:relative;overflow:hidden}
.hero-inner{
  display:grid;grid-template-columns:1.05fr .95fr;gap:32px;align-items:center;
  max-width:1180px;margin:0 auto;padding:56px 20px 130px;position:relative;z-index:2;
}
.hero h1{font-size:clamp(2.3rem,5vw,3.7rem);font-weight:800}
.hero h1 .squiggle{color:var(--accent-dark);position:relative;display:inline-block}
.hero p{margin:18px 0 26px;font-size:1.13rem;max-width:34ch;color:var(--ink-soft);font-weight:600}
.hero-ctas{display:flex;gap:14px;flex-wrap:wrap}
.hero-scene{position:relative;min-height:380px}
.hero-milk{position:absolute;bottom:-24px;left:-2%;width:min(44%,228px);z-index:3;filter:drop-shadow(0 6px 0 rgba(51,42,32,.18))}
.hero-photo{
  position:absolute;border:var(--line);box-shadow:var(--pop);border-radius:var(--r-card);
  overflow:hidden;background:var(--card);
}
.hero-photo img{width:100%;height:100%;object-fit:cover}
.hero-photo figcaption{
  position:absolute;left:0;right:0;bottom:0;background:var(--card);border-top:var(--line);
  font-family:var(--font-display);font-weight:700;font-size:.85rem;padding:.3em .8em;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.hero-photo .price{background:var(--yellow);border:2px solid var(--ink);border-radius:999px;padding:0 .55em;font-size:.82rem}
.hp-1{width:52%;right:2%;top:0;aspect-ratio:1;transform:rotate(2.5deg)}
.hp-2{width:44%;right:30%;top:44%;aspect-ratio:1;transform:rotate(-3deg);z-index:2}
.hp-3{width:34%;right:0;top:56%;aspect-ratio:1;transform:rotate(4deg)}
.cloud{position:absolute;background:var(--cloud);border-radius:999px;opacity:.9}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud-a{width:130px;height:38px;top:40px;left:6%}
.cloud-a::before{width:52px;height:52px;top:-24px;left:22px}
.cloud-a::after{width:38px;height:38px;top:-16px;left:64px}
.cloud-b{width:90px;height:28px;top:120px;right:8%}
.cloud-b::before{width:38px;height:38px;top:-18px;left:16px}
.cloud-b::after{width:26px;height:26px;top:-11px;left:46px}
.cloud-c{width:110px;height:32px;top:24px;right:30%}
.cloud-c::before{width:44px;height:44px;top:-20px;left:20px}
.cloud-c::after{width:30px;height:30px;top:-13px;left:56px}
@media (prefers-reduced-motion:no-preference){
  .cloud-a{animation:drift 26s ease-in-out infinite alternate}
  .cloud-b{animation:drift 32s ease-in-out infinite alternate-reverse}
  .cloud-c{animation:drift 40s ease-in-out infinite alternate}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(46px)}}
}
.grass-edge{position:absolute;bottom:0;left:0;right:0;height:96px;z-index:1}
.grass-edge svg{width:100%;height:100%;display:block}
@media(max-width:820px){
  .hero-inner{grid-template-columns:1fr;padding-bottom:110px}
  .hero p{max-width:none}
  .hero-scene{min-height:340px;margin-top:8px}
  .hero-milk{left:0;width:200px}
}

/* ============ SECTION SHELLS ============ */
section{position:relative}
.sec{padding:84px 0}
.sec-tight{padding:64px 0}
.sec-head{max-width:640px;margin:0 auto 42px;text-align:center}
.sec-head h2{font-size:clamp(1.9rem,3.6vw,2.7rem);font-weight:800}
.sec-head p{margin-top:10px;color:var(--ink-soft);font-weight:600}
.eyebrow{
  display:inline-flex;align-items:center;gap:.5em;font-weight:800;font-size:.8rem;
  letter-spacing:.1em;text-transform:uppercase;color:var(--accent-dark);
  background:var(--accent-soft);border:2px solid var(--ink);border-radius:999px;
  padding:.3em 1em;margin-bottom:14px;
}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.16,1,.3,1),transform .6s cubic-bezier(.16,1,.3,1)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}

/* ============ RESTOCK BOARD ============ */
.board-wrap{display:grid;grid-template-columns:1fr 300px;gap:28px;align-items:start}
.board{padding:26px 26px 30px;background:var(--card)}
.board-top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding-bottom:16px;border-bottom:2.5px dashed var(--ink)}
.board-top h3{font-size:1.45rem;font-weight:800}
.board-date{margin-left:auto;font-weight:700;color:var(--ink-soft);font-size:.92rem}
.stock-list{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;margin-top:8px}
.stock-row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:2px dotted rgba(51,42,32,.25)}
.stock-row:nth-last-child(-n+2){border-bottom:none}
.stock-row b{font-family:var(--font-display);font-weight:700;font-size:1.02rem}
.stock-row small{display:block;color:var(--ink-soft);font-weight:600}
.stock-state{margin-left:auto;font-weight:800;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;border:2px solid var(--ink);border-radius:999px;padding:.22em .8em;white-space:nowrap}
.st-in{background:var(--accent-soft);color:var(--accent-dark)}
.st-low{background:var(--yellow)}
.st-out{background:var(--red-soft);color:var(--red)}
.board-note{margin-top:18px;font-size:.9rem;font-weight:600;color:var(--ink-soft);display:flex;gap:.6em;align-items:flex-start}
.board-note .icon{color:var(--accent-dark);margin-top:.2em}
.station-card{padding:24px;background:var(--sky);text-align:center}
.station-card svg.peek{width:150px;margin:-58px auto 4px;display:block}
.station-card h4{font-size:1.2rem;font-weight:800}
.station-card p{font-weight:600;font-size:.95rem;color:var(--ink-soft);margin:8px 0 14px}
.station-hours{background:var(--card);border:var(--line);border-radius:var(--r-chip);padding:12px;font-weight:700;margin-bottom:14px}
.station-hours b{font-family:var(--font-display);font-size:1.15rem;display:block}
@media(max-width:900px){
  .board-wrap{grid-template-columns:1fr}
  .stock-list{grid-template-columns:1fr}
  .stock-row:nth-last-child(-n+2){border-bottom:2px dotted rgba(51,42,32,.25)}
  .stock-row:last-child{border-bottom:none}
  .station-card{margin-top:40px}
}

/* ============ BESTSELLERS RAIL ============ */
.rail-sec{background:var(--cream-2);border-top:var(--line);border-bottom:var(--line)}
.rail{
  display:flex;gap:22px;overflow-x:auto;padding:10px 20px 26px;
  scroll-snap-type:x mandatory;scrollbar-width:none;max-width:1180px;margin:0 auto;
}
.rail::-webkit-scrollbar{display:none}
.p-card{
  flex:0 0 250px;scroll-snap-align:start;background:var(--card);border:var(--line);
  border-radius:var(--r-card);box-shadow:var(--pop);overflow:hidden;display:flex;flex-direction:column;
  transition:transform .18s ease;
}
.p-card:hover{transform:translateY(-4px) rotate(-.5deg)}
.p-card .ph{aspect-ratio:1;position:relative;border-bottom:var(--line)}
.p-card .ph img{width:100%;height:100%;object-fit:cover}
.p-card .flag{
  position:absolute;top:10px;left:10px;background:var(--yellow);border:2px solid var(--ink);
  border-radius:999px;font-family:var(--font-display);font-weight:700;font-size:.78rem;padding:.15em .7em;
}
.p-card .flag.red{background:var(--red);color:#fff}
.p-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.p-body h3{font-size:1.05rem;font-weight:700}
.p-body p{font-size:.86rem;color:var(--ink-soft);font-weight:600;flex:1}
.p-foot{display:flex;align-items:center;gap:10px;margin-top:6px}
.p-price{font-family:var(--font-display);font-weight:800;font-size:1.2rem}
.p-foot .btn{margin-left:auto}
.rail-hint{display:flex;justify-content:center;gap:8px;margin-top:2px}
.rail-hint button{width:42px;height:42px;border-radius:50%;border:var(--line);background:var(--card);box-shadow:var(--pop-sm);display:inline-flex;align-items:center;justify-content:center}
.rail-hint button:hover{background:var(--yellow)}

/* ============ MENU TABS ============ */
.tabs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:34px}
.tab{
  font-family:var(--font-display);font-weight:700;font-size:.98rem;padding:.55em 1.3em;
  border-radius:999px;border:var(--line);background:var(--card);box-shadow:var(--pop-sm);
}
.tab[aria-selected="true"]{background:var(--ink);color:var(--cream)}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:18px}
.m-item{background:var(--card);border:var(--line);border-radius:var(--r-card);box-shadow:var(--pop-sm);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.m-item h4{font-size:1.02rem;font-weight:700;display:flex;align-items:baseline;gap:10px}
.m-item h4 .p-price{margin-left:auto;font-size:1.05rem;color:var(--accent-dark)}
.m-item p{font-size:.85rem;color:var(--ink-soft);font-weight:600;flex:1}
.m-item .btn{align-self:flex-start;margin-top:4px}
.menu-note{text-align:center;margin-top:26px;font-weight:600;color:var(--ink-soft);font-size:.92rem}
.cat-blurb{text-align:center;max-width:52ch;margin:0 auto 26px;font-weight:600;color:var(--ink-soft)}

/* ============ BUILD A BOX ============ */
.box-sec{background:var(--sky);border-top:var(--line);border-bottom:var(--line)}
.box-grid{display:grid;grid-template-columns:1fr 340px;gap:28px;align-items:start}
.box-sizes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
.size-pick{
  text-align:left;padding:16px 18px;border:var(--line);border-radius:var(--r-card);
  background:var(--card);box-shadow:var(--pop);font-family:var(--font-body);
}
.size-pick b{font-family:var(--font-display);font-size:1.15rem;display:flex;align-items:center;gap:8px}
.size-pick span{font-weight:600;color:var(--ink-soft);font-size:.88rem}
.size-pick .p-price{color:var(--accent-dark)}
.size-pick[aria-pressed="true"]{background:var(--accent-soft);outline:3px solid var(--accent)}
.flavor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.fl-chip{
  display:flex;align-items:center;gap:10px;background:var(--card);border:var(--line);
  border-radius:var(--r-chip);padding:9px 12px;box-shadow:var(--pop-sm);
}
.fl-chip b{font-weight:700;font-size:.86rem;flex:1;line-height:1.25}
.fl-chip .qty{display:flex;align-items:center;gap:7px}
.fl-chip .qty button{width:27px;height:27px;border-radius:50%;border:2px solid var(--ink);background:var(--cream);display:inline-flex;align-items:center;justify-content:center}
.fl-chip .qty button:hover{background:var(--yellow)}
.fl-chip .qty b{min-width:16px;text-align:center;font-size:.95rem}
.box-summary{position:sticky;top:96px;padding:22px;background:var(--card)}
.box-summary h3{font-size:1.25rem;font-weight:800;display:flex;align-items:center;gap:10px}
.box-meter{height:20px;border:var(--line);border-radius:999px;background:var(--cream);margin:14px 0 8px;overflow:hidden}
.box-meter div{height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .3s ease}
.box-count{font-weight:700;color:var(--ink-soft);font-size:.92rem}
.box-picks{margin:12px 0;font-size:.88rem;font-weight:600;color:var(--ink-soft);max-height:130px;overflow:auto}
.box-picks li{list-style:none;display:flex;justify-content:space-between;padding:3px 0}
.box-summary .btn{width:100%}
@media(max-width:900px){.box-grid{grid-template-columns:1fr}.box-summary{position:static}}

/* ============ HOW IT WORKS ============ */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;counter-reset:step}
.step{background:var(--card);border:var(--line);border-radius:var(--r-card);box-shadow:var(--pop);padding:22px 20px;position:relative}
.step::before{
  counter-increment:step;content:counter(step);
  position:absolute;top:-18px;left:18px;width:38px;height:38px;border-radius:50%;
  background:var(--yellow);border:var(--line);display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:800;font-size:1.1rem;
}
.step .icon{width:30px;height:30px;color:var(--accent-dark);margin-bottom:10px}
.step h3{font-size:1.1rem;font-weight:800;margin-bottom:6px}
.step p{font-size:.88rem;font-weight:600;color:var(--ink-soft)}
.step p b{color:var(--ink)}
@media(max-width:960px){.steps{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.steps{grid-template-columns:1fr}}

/* ============ TRACKER ============ */
.track-sec{background:var(--cream-2);border-top:var(--line);border-bottom:var(--line)}
.track-panel{display:grid;grid-template-columns:1fr 330px;gap:0;overflow:hidden;background:var(--card)}
.track-main{padding:30px 32px}
.track-form{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.track-form input{
  flex:1;min-width:200px;border:var(--line);border-radius:var(--r-chip);padding:.7em 1em;
  font:inherit;font-weight:700;background:var(--cream);
}
.track-form input::placeholder{color:#7d7264;font-weight:600}
.demo-tag{display:inline-flex;align-items:center;gap:.45em;background:var(--yellow);border:2px solid var(--ink);border-radius:999px;padding:.2em .8em;font-weight:800;font-size:.75rem;letter-spacing:.05em;text-transform:uppercase}
.timeline{margin-top:24px;display:grid;gap:0}
.t-step{display:grid;grid-template-columns:44px 1fr;gap:14px;position:relative;padding-bottom:26px}
.t-step:last-child{padding-bottom:0}
.t-step::before{content:"";position:absolute;left:21px;top:40px;bottom:0;width:3px;background:rgba(51,42,32,.18);border-radius:2px}
.t-step:last-child::before{display:none}
.t-dot{
  width:44px;height:44px;border-radius:50%;border:var(--line);background:var(--cream);
  display:flex;align-items:center;justify-content:center;z-index:1;
}
.t-dot .icon{width:20px;height:20px;color:var(--ink-soft)}
.t-step.done .t-dot{background:var(--accent);}
.t-step.done .t-dot .icon{color:#fff}
.t-step.now .t-dot{background:var(--yellow);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(61,139,47,.45)}50%{box-shadow:0 0 0 9px rgba(61,139,47,0)}}
@media (prefers-reduced-motion:reduce){.t-step.now .t-dot{animation:none}}
.t-body b{font-family:var(--font-display);font-size:1.02rem;display:block}
.t-body span{font-size:.86rem;font-weight:600;color:var(--ink-soft)}
.t-step.todo{opacity:.5}
.track-side{background:var(--sky);border-left:var(--line);padding:26px 24px;display:flex;flex-direction:column;gap:14px}
.sms{background:var(--card);border:var(--line);border-radius:16px 16px 16px 4px;padding:12px 14px;font-size:.88rem;font-weight:600;box-shadow:var(--pop-sm)}
.sms b{display:block;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:3px}
.track-side svg.peek{width:120px;margin:auto auto 0}
