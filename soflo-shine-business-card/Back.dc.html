  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;500;600;700&family=Saira:ital,wght@1,800;1,900&display=swap">
  <style>

  body { margin:0; background:#08090b; }
  .card { position:relative; width:1050px; height:600px; overflow:hidden; background:#08090b;
          font-family:'Barlow Condensed','Oswald','Arial Narrow',sans-serif; color:#e8ecf1; }
  .sheen { position:absolute; inset:0;
    background:
      radial-gradient(85% 70% at 2% 0%, rgba(76,150,255,.17), rgba(0,0,0,0) 60%),
      radial-gradient(80% 70% at 100% 100%, rgba(255,255,255,.055), rgba(0,0,0,0) 62%); }
  .edge { position:absolute; left:0; top:0; bottom:0; width:11px;
    background:linear-gradient(180deg,#3ba0ff,#0b84ff 40%,#003f9e); }
  .inner { position:absolute; inset:0; padding:52px 62px 48px 80px;
    display:flex; flex-direction:column; box-sizing:border-box; }
  .row { display:flex; justify-content:space-between; gap:40px; }
  .spacer { flex:1; min-height:44px; }
  .lockup { display:flex; flex-direction:column; align-items:center; gap:9px; width:468px; flex:none; }
  .lockup .mark { width:96%; }
  .wordmark { font-family:'Saira','Arial',sans-serif; font-style:italic; font-weight:900;
    font-size:66px; line-height:.92; letter-spacing:.004em; white-space:nowrap; color:#d3d8de; }
  .wordmark .hi { color:#0b84ff; }
  .sub { display:flex; align-items:center; gap:15px; width:100%; }
  .sub span { font-size:27px; font-weight:600; letter-spacing:.44em; color:#8b939d; padding-left:.44em; }
  .sub i { flex:1; height:3px; background:#454b53; }
  .qrwrap { display:flex; flex-direction:column; align-items:center; gap:11px; flex:none; }
  .qr { width:180px; height:180px; background:#f5f7fa; border-radius:10px; padding:12px;
    box-sizing:border-box; }
  .scan { font-size:25px; font-weight:600; letter-spacing:.28em; color:#8b939d; padding-left:.28em; }
  .divider { height:2px; flex:none; margin-bottom:30px;
    background:linear-gradient(90deg,rgba(11,132,255,.9),rgba(255,255,255,.10) 42%,rgba(255,255,255,0)); }
  .name { font-size:60px; font-weight:700; letter-spacing:.075em; line-height:1; color:#f2f5f8;
    white-space:nowrap; }
  .role { margin-top:11px; font-size:27px; font-weight:600; letter-spacing:.3em; color:#0b84ff;
    padding-left:.3em; text-transform:uppercase; }
  .contacts { display:flex; flex-direction:column; gap:13px; align-items:flex-start;
    width:max-content; margin-left:auto; flex:none; }
  .contact { display:flex; align-items:center; gap:14px; font-size:33px; font-weight:500;
    letter-spacing:.05em; line-height:1.06; color:#dfe4ea; white-space:nowrap; }
  .contact svg { width:29px; height:29px; flex:none; }
  a { color:#0b84ff; text-decoration:none; }
  a:hover { color:#4aa5ff; }
  </style>
</helmet>
